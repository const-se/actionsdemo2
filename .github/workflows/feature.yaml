name: Feature

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        run: go build -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Linting
        run: go vet -v ./...
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run unit-tests
        run: go test -v ./...
  test-race:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run unit-tests
        run: go test -race -v ./...
