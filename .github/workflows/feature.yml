name: Feature

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Выгрузка ветки
        uses: actions/checkout@v4
      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Сборка приложения
        run: go build -v ./...
      - name: Запуск тестов
        run: go test -v -count=1 ./...
