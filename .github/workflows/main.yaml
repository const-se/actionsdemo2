name: Feature

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        run: go build -v ./...
  test:
    needs: build
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run unit-tests
        run: go test -v ./...

